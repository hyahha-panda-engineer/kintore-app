<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筋トレ記録</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --primary: #bb86fc;
      --border: #333333;
      --error: #cf6679;
      --edit: #03dac6;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      padding-bottom: 50px;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .row-inputs {
      display: flex;
      gap: 10px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aaa;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 12px;
      background-color: #2c2c2c;
      border: 1px solid var(--border);
      color: var(--text-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    .btn-cancel {
      background-color: #555;
      color: #fff;
      margin-top: 10px;
    }
    .btn-logout {
      background-color: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      margin-top: 20px;
    }
    .totals-list, .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .totals-list li, .history-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .totals-list li:last-child, .history-list li:last-child {
      border-bottom: none;
    }
    .history-text {
      font-size: 15px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-small {
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 4px;
    }
    .btn-edit { background-color: var(--edit); color: #000; }
    .btn-delete { background-color: var(--error); color: #fff; }
    
    .hidden { display: none !important; }
    .error-msg { color: var(--error); font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <h1>筋トレ記録</h1>

  <!-- ログイン画面 -->
  <div id="login-section" class="card hidden">
    <label>ログイン</label>
    <div class="form-group">
      <input type="password" id="password-input" placeholder="パスワードを入力">
    </div>
    <button id="login-btn">ログイン</button>
  </div>

  <!-- アプリ画面 -->
  <div id="app-section" class="hidden">
    <!-- 日付選択 -->
    <div class="card">
      <div class="form-group" style="margin-bottom: 0;">
        <label for="date-select">日付</label>
        <input type="date" id="date-select">
      </div>
    </div>

    <!-- 本日の合計 -->
    <div class="card">
      <label>この日の合計</label>
      <ul id="totals-list" class="totals-list">
        <li style="color: #888;">読み込み中...</li>
      </ul>
    </div>

    <!-- 記録入力 / 編集フォーム -->
    <div class="card" id="input-form-card">
      <label id="form-title">新しく記録する</label>
      <div class="form-group">
        <select id="exercise-select">
          <option value="">読込中...</option>
        </select>
      </div>
      <div class="form-group hidden" id="custom-exercise-group">
        <input type="text" id="custom-exercise" placeholder="種目を自由入力">
      </div>
      <div class="form-group row-inputs">
        <input type="number" id="weight-input" placeholder="重量(kg) ※自重は空欄" min="0" step="0.5">
        <input type="number" id="reps-input" placeholder="回数" min="1">
      </div>
      <button id="submit-btn">記録する</button>
      <button id="cancel-btn" class="btn-cancel hidden">編集をキャンセル</button>
    </div>

    <!-- 本日の履歴 -->
    <div class="card">
      <label>履歴 (修正・削除)</label>
      <ul id="history-list" class="history-list">
        <li style="color: #888;">読み込み中...</li>
      </ul>
    </div>
    
    <button id="logout-btn" class="btn-logout">ログアウト</button>
  </div>
</div>

<script>
  // ==========================================
  // ★ここにGASのURLを貼り付けてください
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbysN4BYl5VB9gRs-8p4vSNUPnr8WFzX8UA1-R18QNQHSQ_Q39t65B0cBslI9WeIIPyi/exec';
  // ==========================================

  let currentPass = localStorage.getItem('kintore_pass') || '';
  let editingRow = null;

  const loginSection = document.getElementById('login-section');
  const appSection = document.getElementById('app-section');
  const passwordInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');

  const dateSelect = document.getElementById('date-select');
  const totalsList = document.getElementById('totals-list');
  const historyList = document.getElementById('history-list');
  const exerciseSelect = document.getElementById('exercise-select');
  const customExerciseGroup = document.getElementById('custom-exercise-group');
  const customExerciseInput = document.getElementById('custom-exercise');
  const weightInput = document.getElementById('weight-input');
  const repsInput = document.getElementById('reps-input');
  const submitBtn = document.getElementById('submit-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const formTitle = document.getElementById('form-title');

  init();

  function init() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    dateSelect.value = `${yyyy}-${mm}-${dd}`;
    checkLoginState();
  }

  function checkLoginState() {
    if (currentPass) {
      loginSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      loadData();
    } else {
      loginSection.classList.remove('hidden');
      appSection.classList.add('hidden');
    }
  }

  loginBtn.addEventListener('click', () => {
    const pass = passwordInput.value.trim();
    if (!pass) return;
    currentPass = pass;
    localStorage.setItem('kintore_pass', pass);
    passwordInput.value = '';
    checkLoginState();
  });

  function forceLogout(message) {
    if (message) alert(message);
    currentPass = '';
    localStorage.removeItem('kintore_pass');
    checkLoginState();
  }
  
  logoutBtn.addEventListener('click', () => forceLogout("ログアウトしました"));

  dateSelect.addEventListener('change', () => {
    resetForm();
    loadData();
  });

  exerciseSelect.addEventListener('change', (e) => {
    if (e.target.value === 'その他') {
      customExerciseGroup.classList.remove('hidden');
    } else {
      customExerciseGroup.classList.add('hidden');
      customExerciseInput.value = '';
    }
  });

  cancelBtn.addEventListener('click', resetForm);

  submitBtn.addEventListener('click', async () => {
    const date = dateSelect.value;
    let exercise = exerciseSelect.value;
    if (exercise === 'その他') exercise = customExerciseInput.value.trim();
    const weight = parseFloat(weightInput.value) || 0;
    const reps = parseInt(repsInput.value, 10);

    if (!date || !exercise || !reps || reps <= 0) {
      alert("種目と回数は正しく入力してください。");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";

    const payload = {
      action: editingRow ? 'update' : 'add',
      row: editingRow,
      date: date,
      exercise: exercise,
      weight: weight,
      reps: reps,
      pass: currentPass
    };

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      
      const result = await response.json();
      if (result.error === 'auth_error') {
        forceLogout(result.message);
        return;
      } else if (result.error) {
        alert(result.error);
        return;
      }
      
      resetForm();
      await loadData();
    } catch (error) {
      alert("エラーが発生しました: " + error.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function deleteRecord(row) {
    if (!confirm("この記録を削除してもよろしいですか？")) return;
    historyList.innerHTML = '<li style="color: #888;">削除中...</li>';
    const payload = { action: 'delete', row: row, pass: currentPass };

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (result.error === 'auth_error') {
        forceLogout(result.message);
        return;
      } else if (result.error) alert(result.error);
      
      if (editingRow === row) resetForm();
      await loadData();
    } catch (error) {
      alert("エラーが発生しました: " + error.message);
      await loadData();
    }
  }

  function startEdit(row, exercise, weight, reps) {
    editingRow = row;
    const options = [...exerciseSelect.options].map(o => o.value);
    if (options.includes(exercise)) {
      exerciseSelect.value = exercise;
      customExerciseGroup.classList.add('hidden');
      customExerciseInput.value = '';
    } else {
      exerciseSelect.value = 'その他';
      customExerciseGroup.classList.remove('hidden');
      customExerciseInput.value = exercise;
    }
    
    weightInput.value = weight > 0 ? weight : '';
    repsInput.value = reps;
    
    formTitle.textContent = "記録を修正する";
    formTitle.style.color = "var(--edit)";
    submitBtn.textContent = "更新する";
    submitBtn.style.backgroundColor = "var(--edit)";
    cancelBtn.classList.remove('hidden');
    document.getElementById('input-form-card').scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    editingRow = null;
    formTitle.textContent = "新しく記録する";
    formTitle.style.color = "#aaa";
    submitBtn.textContent = "記録する";
    submitBtn.style.backgroundColor = "var(--primary)";
    cancelBtn.classList.add('hidden');
    weightInput.value = '';
    repsInput.value = '';
    exerciseSelect.value = '';
    customExerciseGroup.classList.add('hidden');
    customExerciseInput.value = '';
  }

  async function loadData() {
    if (!GAS_URL.startsWith('http')) return;
    totalsList.innerHTML = '<li style="color: #888;">読み込み中...</li>';
    historyList.innerHTML = '<li style="color: #888;">読み込み中...</li>';

    try {
      const targetDate = dateSelect.value;
      const response = await fetch(`${GAS_URL}?date=${targetDate}&pass=${currentPass}`);
      const data = await response.json();

      if (data.error === 'auth_error') {
        forceLogout(data.message);
        return;
      } else if (data.error) {
        totalsList.innerHTML = `<li class="error-msg">${data.error}</li>`;
        historyList.innerHTML = `<li class="error-msg">${data.error}</li>`;
        return;
      }

      const currentSelection = exerciseSelect.value;
      exerciseSelect.innerHTML = '';
      data.choices.forEach(choice => {
        const option = document.createElement('option');
        option.value = choice;
        option.textContent = choice;
        exerciseSelect.appendChild(option);
      });
      if (currentSelection && [...exerciseSelect.options].some(o => o.value === currentSelection)) {
        exerciseSelect.value = currentSelection;
      }

      // 合計リストの描画
      totalsList.innerHTML = '';
      const totals = data.totals;
      if (Object.keys(totals).length === 0) {
        totalsList.innerHTML = '<li style="color: #888;">この日の記録はありません</li>';
      } else {
        for (const [ex, stats] of Object.entries(totals)) {
          const li = document.createElement('li');
          const nameSpan = document.createElement('span');
          nameSpan.textContent = ex;
          const countSpan = document.createElement('span');
          
          // 総負荷量(kg)がある場合は表示、自重のみなら回数だけ
          if (stats.volume > 0) {
            countSpan.textContent = `${stats.volume}kg (${stats.reps}回)`;
          } else {
            countSpan.textContent = `${stats.reps}回`;
          }
          
          li.appendChild(nameSpan);
          li.appendChild(countSpan);
          totalsList.appendChild(li);
        }
      }

      // 履歴リストの描画
      historyList.innerHTML = '';
      const history = data.history || [];
      if (history.length === 0) {
        historyList.innerHTML = '<li style="color: #888;">この日の記録はありません</li>';
      } else {
        history.forEach(item => {
          const li = document.createElement('li');
          const textSpan = document.createElement('span');
          textSpan.className = 'history-text';
          
          if (item.weight > 0) {
            textSpan.textContent = `${item.exercise} - ${item.weight}kg × ${item.reps}回`;
          } else {
            textSpan.textContent = `${item.exercise} - ${item.reps}回`;
          }
          
          const btnGroup = document.createElement('div');
          btnGroup.className = 'btn-group';
          
          const editBtn = document.createElement('button');
          editBtn.className = 'btn-small btn-edit';
          editBtn.textContent = '編集';
          editBtn.onclick = () => startEdit(item.row, item.exercise, item.weight, item.reps);
          
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-small btn-delete';
          delBtn.textContent = '削除';
          delBtn.onclick = () => deleteRecord(item.row);
          
          btnGroup.appendChild(editBtn);
          btnGroup.appendChild(delBtn);
          
          li.appendChild(textSpan);
          li.appendChild(btnGroup);
          historyList.appendChild(li);
        });
      }
    } catch (error) {
      totalsList.innerHTML = `<li class="error-msg">読込エラー: ${error.message}</li>`;
      historyList.innerHTML = `<li class="error-msg">読込エラー</li>`;
    }
  }
</script>
</body>
</html>
