<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筋トレ記録</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --primary: #bb86fc;
      --border: #333333;
      --error: #cf6679;
      --edit: #03dac6;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      padding-bottom: 80px; 
    }
    .container { width: 100%; max-width: 400px; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .row-inputs { display: flex; gap: 10px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; font-weight: bold; }
    input, select { width: 100%; padding: 12px; background-color: #2c2c2c; border: 1px solid var(--border); color: var(--text-color); border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; padding: 14px; background-color: var(--primary); color: #000; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #555; cursor: not-allowed; }
    .btn-cancel { background-color: #555; color: #fff; margin-top: 10px; }
    
    .totals-list, .history-list { list-style: none; padding: 0; margin: 0; }
    .totals-list li, .history-list li { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .totals-list li:last-child, .history-list li:last-child { border-bottom: none; }
    .history-text { font-size: 15px; }
    .btn-group { display: flex; gap: 6px; }
    .btn-small { width: auto; padding: 6px 10px; font-size: 12px; border-radius: 4px; }
    .btn-edit { background-color: var(--edit); color: #000; }
    .btn-delete { background-color: var(--error); color: #fff; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #1e1e1e; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 10px 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 100; }
    .nav-item { background: none; border: none; color: #888; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 30%; padding: 8px 0; }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 20px; }

    .chart-container { display: flex; justify-content: space-between; align-items: flex-end; height: 160px; padding-top: 10px; margin-bottom: 10px; }
    .chart-col { display: flex; flex-direction: column; align-items: center; width: 12%; }
    .chart-bar-bg { width: 100%; height: 100px; background-color: #333; border-radius: 4px; display: flex; align-items: flex-end; margin-bottom: 6px; }
    .chart-bar-fill { width: 100%; background-color: var(--primary); border-radius: 4px; transition: height 0.5s; }
    .chart-label { font-size: 10px; color: #888; }
    .chart-val { font-size: 10px; color: #e0e0e0; margin-bottom: 2px; }

    /* トグルボタン（セグメントコントロール） */
    .segment-control { display: flex; background: #2c2c2c; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    .segment-control label { flex: 1; text-align: center; padding: 10px 0; margin: 0; cursor: pointer; color: #888; font-size: 13px; }
    .segment-control label:not(:last-child) { border-right: 1px solid var(--border); }
    .segment-control input[type="radio"] { display: none; }
    .segment-control input[type="radio"]:checked + span { color: var(--primary); font-weight: bold; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>筋トレ記録</h1>

  <!-- ログイン画面 -->
  <div id="login-section" class="card hidden">
    <label>ログイン</label>
    <div class="form-group">
      <input type="password" id="password-input" placeholder="パスワードを入力">
    </div>
    <button id="login-btn">ログイン</button>
  </div>

  <!-- アプリ画面全体 -->
  <div id="app-section" class="hidden">
    
    <!-- ▼▼ 入力タブ ▼▼ -->
    <div id="tab-input" class="tab-content active">
      <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="date-select">日付</label>
          <input type="date" id="date-select">
        </div>
      </div>

      <div class="card">
        <label>この日の合計</label>
        <ul id="totals-list" class="totals-list"><li style="color: #888;">読み込み中...</li></ul>
      </div>

      <div class="card" id="input-form-card">
        <label id="form-title">新しく記録する</label>
        <div class="form-group">
          <select id="exercise-select"><option value="">読込中...</option></select>
        </div>
        <div class="form-group hidden" id="custom-exercise-group">
          <input type="text" id="custom-exercise" placeholder="種目を自由入力">
        </div>
        <div class="form-group row-inputs">
          <input type="number" id="weight-input" placeholder="重量(kg) ※自重は空欄" min="0" step="0.5">
          <input type="number" id="reps-input" placeholder="回数" min="1">
        </div>
        <button id="submit-btn">記録する</button>
        <button id="cancel-btn" class="btn-cancel hidden">編集をキャンセル</button>
      </div>

      <div class="card">
        <label>履歴 (修正・削除)</label>
        <ul id="history-list" class="history-list"><li style="color: #888;">読み込み中...</li></ul>
      </div>
    </div>
    <!-- ▲▲ 入力タブ ▲▲ -->


    <!-- ▼▼ 分析タブ ▼▼ -->
    <div id="tab-stats" class="tab-content">
      <div class="card">
        <label>直近7日間の総負荷</label>
        <div id="volume-chart-container" class="chart-container">
          <div style="color: #888; font-size: 14px; margin: auto;">読み込み中...</div>
        </div>
      </div>

      <div class="card">
        <label>種目別の成長記録</label>
        <div class="form-group">
          <select id="stats-exercise-select">
            <option value="">種目を選択してください</option>
          </select>
        </div>
        
        <!-- 絞り込みトグル -->
        <div class="segment-control form-group">
          <label>
            <input type="radio" name="stats-filter" value="all" checked>
            <span>すべて</span>
          </label>
          <label>
            <input type="radio" name="stats-filter" value="bodyweight">
            <span>自重のみ</span>
          </label>
          <label>
            <input type="radio" name="stats-filter" value="weighted">
            <span>荷重あり</span>
          </label>
        </div>

        <!-- 順序切り替えトグル -->
        <div class="segment-control form-group">
          <label>
            <input type="radio" name="stats-sort" value="single" checked>
            <span>一回の最高記録</span>
          </label>
          <label>
            <input type="radio" name="stats-sort" value="daily">
            <span>一日の総負荷</span>
          </label>
        </div>

        <ul id="stats-history-list" class="history-list">
          <li style="color: #888;">上に種目を選んでください</li>
        </ul>
      </div>
    </div>
    <!-- ▲▲ 分析タブ ▲▲ -->

    <!-- 下部ナビゲーション -->
    <nav class="bottom-nav">
      <button id="nav-input" class="nav-item active">
        <span class="nav-icon">📝</span>
        <span>入力</span>
      </button>
      <button id="nav-stats" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>分析</span>
      </button>
      <button id="nav-logout" class="nav-item">
        <span class="nav-icon">🚪</span>
        <span>ログアウト</span>
      </button>
    </nav>

  </div>
</div>

<script>
  // ==========================================
  // ★ここにGASのURLを貼り付けてください
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxuGvcGzahjM8VWR0V8e90TMOJE2nV-L9W6R44hBpNa3rHqpqssij5xEL8jQGuByHDR/exec';
  // ==========================================

  let currentPass = localStorage.getItem('kintore_pass') || '';
  let editingRow = null;
  let cachedStatsHistory = {};

  const loginSection = document.getElementById('login-section');
  const appSection = document.getElementById('app-section');
  const passwordInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');

  const dateSelect = document.getElementById('date-select');
  const totalsList = document.getElementById('totals-list');
  const historyList = document.getElementById('history-list');
  const exerciseSelect = document.getElementById('exercise-select');
  const customExerciseGroup = document.getElementById('custom-exercise-group');
  const customExerciseInput = document.getElementById('custom-exercise');
  const weightInput = document.getElementById('weight-input');
  const repsInput = document.getElementById('reps-input');
  const submitBtn = document.getElementById('submit-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const formTitle = document.getElementById('form-title');

  const volumeChartContainer = document.getElementById('volume-chart-container');
  const statsExerciseSelect = document.getElementById('stats-exercise-select');
  const statsHistoryList = document.getElementById('stats-history-list');

  const tabInput = document.getElementById('tab-input');
  const tabStats = document.getElementById('tab-stats');
  const navInput = document.getElementById('nav-input');
  const navStats = document.getElementById('nav-stats');
  const navLogout = document.getElementById('nav-logout');

  init();

  function init() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    dateSelect.value = `${yyyy}-${mm}-${dd}`; checkLoginState(); }  function checkLoginState() { if (currentPass) { loginSection.classList.add('hidden'); appSection.classList.remove('hidden'); loadDailyData(); } else { loginSection.classList.remove('hidden'); appSection.classList.add('hidden'); } }  loginBtn.addEventListener('click', () => { const pass = passwordInput.value.trim(); if (!pass) return; currentPass = pass; localStorage.setItem('kintore_pass', pass); passwordInput.value = ''; checkLoginState(); });  function forceLogout(message) { if (message) alert(message); currentPass = ''; localStorage.removeItem('kintore_pass'); checkLoginState(); } navLogout.addEventListener('click', () => { if(confirm("ログアウトしますか？")) forceLogout(); });  navInput.addEventListener('click', () => { tabInput.classList.add('active'); tabStats.classList.remove('active'); navInput.classList.add('active'); navStats.classList.remove('active'); loadDailyData(); });  navStats.addEventListener('click', () => { tabStats.classList.add('active'); tabInput.classList.remove('active'); navStats.classList.add('active'); navInput.classList.remove('active'); loadStatsData(); });  dateSelect.addEventListener('change', () => { resetForm(); loadDailyData(); });  exerciseSelect.addEventListener('change', (e) => { if (e.target.value === 'その他') { customExerciseGroup.classList.remove('hidden'); } else { customExerciseGroup.classList.add('hidden'); customExerciseInput.value = ''; } });  cancelBtn.addEventListener('click', resetForm);  submitBtn.addEventListener('click', async () => { const date = dateSelect.value; let exercise = exerciseSelect.value; if (exercise === 'その他') exercise = customExerciseInput.value.trim(); const weight = parseFloat(weightInput.value) \vert{}\vert{} 0; const reps = parseInt(repsInput.value, 10);  if (!date \vert{}\vert{} !exercise \vert{}\vert{} !reps \vert{}\vert{} reps <= 0) { alert("種目と回数は正しく入力してください。"); return; }  submitBtn.disabled = true; submitBtn.textContent = "送信中...";  const payload = { action: editingRow ? 'update' : 'add', row: editingRow, date: date, exercise: exercise, weight: weight, reps: reps, pass: currentPass }; try { const response = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); const result = await response.json(); if (result.error === 'auth_error') { forceLogout(result.message); return; } else if (result.error) { alert(result.error); return; } resetForm(); await loadDailyData(); } catch (error) { alert("エラー: " + error.message); } finally { submitBtn.disabled = false; } });  async function deleteRecord(row) { if (!confirm("削除しますか？")) return; historyList.innerHTML = '<li style="color: #888;">削除中...</li>'; try { const response = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'delete', row: row, pass: currentPass }) }); const result = await response.json(); if (result.error === 'auth_error') { forceLogout(result.message); return; } if (editingRow === row) resetForm(); await loadDailyData(); } catch (error) { alert("エラー: " + error.message); await loadDailyData(); } }  function startEdit(row, exercise, weight, reps) { editingRow = row; const options = [...exerciseSelect.options].map(o => o.value); if (options.includes(exercise)) { exerciseSelect.value = exercise; customExerciseGroup.classList.add('hidden'); } else { exerciseSelect.value = 'その他'; customExerciseGroup.classList.remove('hidden'); customExerciseInput.value = exercise; } weightInput.value = weight > 0 ? weight : ''; repsInput.value = reps; formTitle.textContent = "記録を修正する"; formTitle.style.color = "var(--edit)"; submitBtn.textContent = "更新する"; submitBtn.style.backgroundColor = "var(--edit)"; cancelBtn.classList.remove('hidden'); document.getElementById('input-form-card').scrollIntoView({ behavior: 'smooth' }); }  function resetForm() { editingRow = null; formTitle.textContent = "新しく記録する"; formTitle.style.color = "#aaa"; submitBtn.textContent = "記録する"; submitBtn.style.backgroundColor = "var(--primary)"; cancelBtn.classList.add('hidden'); weightInput.value = ''; repsInput.value = ''; exerciseSelect.value = ''; customExerciseGroup.classList.add('hidden'); }  async function loadDailyData() { if (!GAS_URL.startsWith('http')) return; totalsList.innerHTML = '<li style="color: #888;">読み込み中...</li>'; historyList.innerHTML = '<li style="color: #888;">読み込み中...</li>'; try { const response = await fetch(`${GAS_URL}?date=${dateSelect.value}&pass=${currentPass}`);
      const data = await response.json();
      if (data.error === 'auth_error') { forceLogout(data.message); return; }

      const currentSelection = exerciseSelect.value;
      exerciseSelect.innerHTML = '';
      data.choices.forEach(choice => {
        const option = document.createElement('option'); option.value = choice; option.textContent = choice; exerciseSelect.appendChild(option);
      });
      if (currentSelection && [...exerciseSelect.options].some(o => o.value === currentSelection)) { exerciseSelect.value = currentSelection; }

      totalsList.innerHTML = '';
      if (Object.keys(data.totals).length === 0) { totalsList.innerHTML = '<li style="color: #888;">この日の記録はありません</li>'; } 
      else {
        for (const [ex, stats] of Object.entries(data.totals)) {
          const li = document.createElement('li'); const nameSpan = document.createElement('span'); nameSpan.textContent = ex; const countSpan = document.createElement('span');
          countSpan.textContent = stats.volume > 0 ? `${stats.volume}kg (${stats.reps}回)` : `${stats.reps}回`; li.appendChild(nameSpan); li.appendChild(countSpan); totalsList.appendChild(li); } }  historyList.innerHTML = ''; if (data.history.length === 0) { historyList.innerHTML = '<li style="color: #888;">この日の記録はありません</li>'; } else { data.history.forEach(item => { const li = document.createElement('li'); const textSpan = document.createElement('span'); textSpan.className = 'history-text'; textSpan.textContent = item.weight > 0 ? `${item.exercise} - ${item.weight}kg × ${item.reps}回` : `${item.exercise} -${item.reps}回`;
          
          const btnGroup = document.createElement('div'); btnGroup.className = 'btn-group';
          const editBtn = document.createElement('button'); editBtn.className = 'btn-small btn-edit'; editBtn.textContent = '編集'; editBtn.onclick = () => startEdit(item.row, item.exercise, item.weight, item.reps);
          const delBtn = document.createElement('button'); delBtn.className = 'btn-small btn-delete'; delBtn.textContent = '削除'; delBtn.onclick = () => deleteRecord(item.row);
          
          btnGroup.appendChild(editBtn); btnGroup.appendChild(delBtn);
          li.appendChild(textSpan); li.appendChild(btnGroup); historyList.appendChild(li);
        });
      }
    } catch (error) { totalsList.innerHTML = `<li class="error-msg">読込エラー: ${error.message}</li>`; } }  async function loadStatsData() { volumeChartContainer.innerHTML = '<div style="color: #888; font-size: 14px; margin: auto;">読み込み中...</div>'; try { const response = await fetch(`${GAS_URL}?mode
